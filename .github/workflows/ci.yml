name: ci

on:
  push:
  pull_request:

env:
  MUSL_SRC: ${{ github.workspace }}/musl

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch musl headers source (SrDicov mirror)
        run: git clone --depth 1 https://github.com/SrDicov/musl.git "$MUSL_SRC"

      - name: Install Rust stable + musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt

      - name: rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (host)
        run: cargo build --verbose

      - name: Build (x86_64-unknown-linux-musl)
        run: cargo build --verbose --target x86_64-unknown-linux-musl

      - name: Test (runs build.rs ABI probe + asserts + unit tests)
        run: 'timeout 100 cargo test --verbose -- --skip thread::'
      # DIAG ONLY (revert): bisect the thread-test hang/crash in isolation,
      # each bounded so a hang fails fast instead of burning hours.
      - name: Test thread create only
        run: 'timeout 100 cargo test --verbose -- thread::create:: --test-threads=1'
      - name: Test synccall only
        run: 'timeout 100 cargo test --verbose -- thread::synccall::tests::signal_delivery --test-threads=1'
      # DIAG ONLY gdb the wave fault (revert): breakpoint at handler entry
      # tells entry apart from delivery faults; then step a few insns.
      - name: DIAG gdb wave fault
        if: always()
        run: |
          sudo apt-get install -y gdb
          cargo test --no-run --verbose
          BIN=$(ls -t target/debug/deps/zlibc-* | grep -v '\.' | head -1)
          timeout 120 gdb -batch -ex 'set confirm off' -ex 'break zlibc::thread::synccall::synccall_handler' -ex run -ex 'bt 8' -ex 'info registers rip rsp fs_base' -ex 'stepi 8' -ex 'bt 5' --args "$BIN" thread::synccall --test-threads=1 --nocapture | tail -50
