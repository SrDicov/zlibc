name: ci

on:
  push:
  pull_request:

env:
  MUSL_SRC: ${{ github.workspace }}/musl

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch musl headers source (SrDicov mirror)
        run: git clone --depth 1 https://github.com/SrDicov/musl.git "$MUSL_SRC"

      - name: Install Rust stable + musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt

      - name: rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (host)
        run: cargo build --verbose

      - name: Build (x86_64-unknown-linux-musl)
        run: cargo build --verbose --target x86_64-unknown-linux-musl

      - name: Test (non-thread, parallel)
        run: 'timeout 120 cargo test --verbose -- --skip thread:: --skip errno::tests::errno_is_per_thread --skip validation::'
      # Thread tests touch per-thread CPU state (FS) and process-global
      # signal dispositions/registry: serial by design, like musl's own
      # tests. Parallel cargo threads would interleave that global state.
      # The errno test clones a real thread, so it rides along here.
      # So does the D5 validation test (threads + malloc + stdio).
      - name: Test thread (serial)
        run: 'timeout 120 cargo test --verbose -- thread:: errno::tests::errno_is_per_thread validation:: --test-threads=1'
      # DIAG ONLY stress serial x5 (revert): measures the validation flake
      # rate. Any single failure fails the step with its output.
      - name: DIAG stress serial x5
        if: always()
        run: 'for i in 1 2 3 4 5; do echo "=== pass $i ==="; timeout 100 cargo test -- thread:: errno::tests::errno_is_per_thread validation:: --test-threads=1 || exit 1; done'
