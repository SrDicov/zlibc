name: ci

on:
  push:
  pull_request:

env:
  MUSL_SRC: ${{ github.workspace }}/musl

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch musl headers source (SrDicov mirror)
        run: git clone --depth 1 https://github.com/SrDicov/musl.git "$MUSL_SRC"

      - name: Install Rust stable + musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt

      - name: rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (host)
        run: cargo build --verbose

      - name: Build (x86_64-unknown-linux-musl)
        run: cargo build --verbose --target x86_64-unknown-linux-musl

      - name: Test (non-thread, parallel)
        run: 'cargo test --verbose -- --skip thread::'
      # Thread tests touch per-thread CPU state (FS) and process-global
      # signal dispositions/registry: serial by design, like musl's own
      # tests. Parallel cargo threads would interleave that global state.
      - name: Test thread (serial)
        run: 'cargo test --verbose -- thread:: --test-threads=1'
      # DIAG ONLY segv hunt (revert): backtrace the parallel-step death.
      - name: DIAG gdb parallel segv
        if: always()
        run: |
          sudo apt-get install -y gdb
          cargo test --no-run --verbose
          BIN=$(ls -t target/debug/deps/zlibc-* | grep -v '\.' | head -1)
          timeout 120 gdb -batch -ex 'set confirm off' -ex run -ex 'thread apply all bt 8' -ex 'info registers rip rsp rdi rsi fs_base' -ex 'x/gx $fs_base+128' --args "$BIN" --skip thread:: --test-threads=8 --nocapture | tail -60
