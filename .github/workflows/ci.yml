name: ci

on:
  push:
  pull_request:

env:
  MUSL_SRC: ${{ github.workspace }}/musl

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch musl headers source (SrDicov mirror)
        run: git clone --depth 1 https://github.com/SrDicov/musl.git "$MUSL_SRC"

      - name: Install Rust stable + musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt

      - name: rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (host)
        run: cargo build --verbose

      - name: Build (x86_64-unknown-linux-musl)
        run: cargo build --verbose --target x86_64-unknown-linux-musl

      - name: Test (non-thread, parallel)
        run: 'timeout 120 cargo test --verbose -- --skip thread:: --skip errno::tests::errno_is_per_thread --skip validation:: --skip ldso::linkmap::'
      # Thread tests touch per-thread CPU state (FS) and process-global
      # signal dispositions/registry: serial by design, like musl's own
      # tests. Parallel cargo threads would interleave that global state.
      # The errno test clones a real thread, so it rides along here.
      # So does the D5 validation test (threads + malloc + stdio).
      # Thread tests touch per-thread CPU state (FS) and process-global
      # signal dispositions/registry: serial by design, like musl's own
      # tests. Parallel cargo threads would interleave that global state.
      # The errno test clones a real thread, so it rides along here.
      # So does the D5 validation test (threads + malloc + stdio), and
      # the link-map tests, which own the loader's namespace globals
      # (head/tail/syms_tail) exactly like the thread registry owns its.
      - name: Test thread (serial)
        run: 'timeout 120 cargo test --verbose -- thread:: errno::tests::errno_is_per_thread validation:: ldso::linkmap:: --test-threads=1'
      # Everything above is -O0 codegen. Release is where LLVM first sees
      # the byte-loops and the inline asm: run the whole suite optimized,
      # serially, so optimization regressions surface here and not at the
      # Alpine gate (6E), where nothing can be bisected.
      - name: Build (host, release)
        run: cargo build --release --verbose
      # Host side of the mem* gate, before the release-test binary runs:
      # these six symbols link statically into every host test binary
      # and interpose glibc's (seen: release `bcmp` trapped with SIGILL
      # in libtest arg parsing, zero tests run). Same checks as the musl
      # gate: present, no self-call, no `ud2` (a trap in one of these
      # panic-free leaf loops is always a miscompile, never a guard).
      - name: mem* gate (host release codegen)
        run: |
          fail=0
          for s in memcpy memmove memset memcmp strlen bcmp; do
            for f in target/release/deps/libzlibc-*.rlib; do
              body=$(objdump -d --disassemble="$s" "$f" 2>/dev/null) || true
              if ! echo "$body" | grep -q "<$s>:"; then
                echo "::error file=$f::$s absent from host release codegen (gate would be vacuous)"
                fail=1
                continue
              fi
              calls=$(echo "$body" | awk -v sym="<$s>:" '
                $0 ~ sym {b=1; next}
                b && /^[[:space:]]*$/ {exit}
                b && /call/ {print}')
              if echo "$calls" | grep -qw "$s"; then
                echo "::error file=$f::$s self-calls in host release codegen"
                fail=1
              fi
              if echo "$body" | grep -qw ud2; then
                echo "::error file=$f::$s contains ud2 in host release codegen"
                fail=1
              fi
            done
          done
          exit $fail
      - name: Test (release codegen, serial)
        run: 'timeout 300 cargo test --release -- --test-threads=1'

      - name: Diagnose release-test crash on failure
        if: failure()
        run: |
          sudo apt-get install -y gdb binutils
          bin=$(ls -t target/release/deps/zlibc-* 2>/dev/null | grep -v '\.' | head -1 || true)
          echo "=== test binary: ${bin:-<none built>} ==="
          if [ -n "$bin" ]; then
          echo "=== can it even list tests? (crash here = init-time) ==="
          "$bin" --list 2>&1 | tail -3 || true
          echo "=== serial tail (crasher is the test after the last ok) ==="
          "$bin" --test-threads=1 2>&1 | tail -5 || true
          echo "=== backtrace ==="
          gdb --batch --ex run --ex bt --args "$bin" --test-threads=1 2>&1 | tail -30 || true
          fi

      - name: Build (x86_64-unknown-linux-musl, release)
        run: cargo build --release --target x86_64-unknown-linux-musl
      # A byte-loop in a `#[no_mangle] memcpy` that LLVM turns into a call
      # to memcpy is an infinite recursion, not a compile error — it would
      # only ever show as a stack overflow at runtime. LoopIdiomRecognize
      # aborts on functions named exactly memcpy/memset/memmove, so this is
      # a guard, not a known bug: prove it on the emitted code instead of
      # trusting the guard. Fail = fix the loop word-at-a-time (musl's
      # shape), never `#[no_builtins]`.
      # The symbol-presence check is load-bearing: a renamed/missing symbol
      # would make "zero calls" look like a pass, i.e. a gate that can
      # never fail. Absence is an error, not a green.
      - name: Symbol coverage vs musl
        run: ./tools/symbol-gate.sh

      - name: mem* must not self-call (release codegen)
        run: |
          fail=0
          for s in memcpy memmove memset memcmp strlen bcmp; do
            for f in target/x86_64-unknown-linux-musl/release/deps/libzlibc-*.rlib; do
              body=$(objdump -d --disassemble="$s" "$f" 2>/dev/null) || true
              if ! echo "$body" | grep -q "<$s>:"; then
                echo "::error file=$f::$s absent from release codegen (gate would be vacuous)"
                fail=1
                continue
              fi
              calls=$(echo "$body" | awk -v sym="<$s>:" '
                $0 ~ sym {b=1; next}
                b && /^[[:space:]]*$/ {exit}
                b && /call/ {print}')
              if echo "$calls" | grep -qw "$s"; then
                echo "::error file=$f::$s self-calls in release codegen"
                fail=1
              fi
              if echo "$body" | grep -qw ud2; then
                echo "::error file=$f::$s contains ud2 in release codegen"
                fail=1
              fi
            done
          done
          exit $fail
      # Wave 5 gate packet 1: a real binary on zlibc only (our `_start`,
      # no host libc). The hello crate builds itself (abort + nostdlib);
      # this step asserts the exact bytes and the exit status.
      - name: Hello on zlibc only
        run: |
          cd hello
          cargo fmt --check
          for b in hello hello-threads hello-malloc hello-args hello-fs; do
            echo "== clippy $b =="
            cargo clippy --bin "$b" -- -D warnings || exit 1
          done
          for b in hello hello-threads hello-malloc hello-args hello-fs; do
            echo "== build $b =="
            cargo build --bin "$b" --verbose || exit 1
          done
          out=$(./target/debug/hello)
          test "$out" = "hello from zlibc"
          out=$(./target/debug/hello-threads)
          test "$out" = "threads total 4950"
          out=$(./target/debug/hello-malloc)
          exp=$(printf 'malloc ok 16 1024 70000\ncalloc zero ok\nrealloc ok')
          test "$out" = "$exp"
          out=$(TEST_MARKER=zzq ./target/debug/hello-args a1 "a b" a3)
          exp=$(printf 'argc=4\nargv=a1\nargv=a b\nargv=a3\nenv=zzq')
          test "$out" = "$exp"
          out=$(./target/debug/hello-fs)
          test "$out" = "fs ok 11 bytes"

  # Gate 6E smoke (a): a musl-gcc hello running on OUR libc.so as its
  # interpreter. Binary (a) is first because it exercises the whole cold
  # path with one moving part (printf); (c), (d), (e) add TLS, threads
  # and COPY on top of a green (a). The hello is linked with an explicit
  # --dynamic-linker (no patchelf, nothing under /lib is touched).
  smoke-6e-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch musl headers source (SrDicov mirror)
        run: git clone --depth 1 https://github.com/SrDicov/musl.git "$MUSL_SRC"

      - name: Install Rust stable + musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt

      - name: Install musl-gcc
        run: sudo apt-get install -y musl-tools strace gdb

      - name: Build the linkable libc (cdylib)
        run: cargo build --release --verbose --target x86_64-unknown-linux-musl

      - name: Link the interpreter (musl two-stage shape)
        run: |
          # Cargo only hardlinks the manifest crate-types to the target
          # root; the RUSTFLAGS-added staticlib lands in deps/ hashed.
          a=$(ls -t target/x86_64-unknown-linux-musl/release/deps/libzlibc-*.a | head -1)
          test -f "$a"
          mkdir -p /tmp/zlibc-smoke
          echo "== entry symbols present =="
          nm --defined-only "$a" 2>/dev/null | grep -wE '_dlstart|_dlstart_boot|_dlstart_c'
          # --whole-archive: an archive only donates members that resolve
          # an undefined symbol, and a freestanding libc has almost no
          # undefined references to trigger on (musl links loose objects
          # for the same reason: everything goes in, unconditionally).
          # -Bsymbolic-functions: internal calls bind locally (direct
          # PC32, no PLT). Without it the very first call out of
          # `_dlstart` goes through an unrelocated PLT and dies there
          # (seen: fault next to `_dlstart_boot@plt`). Data references
          # stay preemptible on purpose: COPY interposition needs the
          # executable's `.bss` to win over our `.data`.
          cc -nostdlib -shared -Wl,-e,_dlstart -Wl,-Bsymbolic-functions \
            -o /tmp/zlibc-smoke/ld-musl-x86_64.so.1 \
            -Wl,--whole-archive "$a" -Wl,--no-whole-archive

      - name: Inspect the interpreter candidate
        run: |
          so=/tmp/zlibc-smoke/ld-musl-x86_64.so.1
          echo "== entry =="
          readelf -h "$so" | grep -i entry
          echo "== UNDEF imports (want: only main) =="
          nm -D --undefined-only "$so" | head -20
          # `main` is the only honest UNDEF: our `_start_c` lives in the
          # .so and takes its address, and the executable provides it at
          # load time. Anything else is a missing provider.
          undefs=$(nm -D --undefined-only "$so" | awk '{print $NF}' | sort -u | tr '\n' ' ')
          test "$undefs" = "main "
          echo "== _dlstart exported =="
          nm -D --defined-only "$so" | grep -w _dlstart
          echo "== _dlstart disassembly (must be PIC-clean: no GOT/PLT before self-reloc) =="
          objdump -d --disassemble=_dlstart "$so"
          echo "== _dlstart_boot calls (want: no @plt) =="
          objdump -d --disassemble=_dlstart_boot "$so" | head -60
          echo "== _dlstart_c head =="
          objdump -d --disassemble=_dlstart_c "$so" | head -30
          echo "== pre-reloc indirect/GOT uses (want: none) =="
          for f in _dlstart _dlstart_boot _dlstart_c find_auxv relocate_self zero_words decode_dyn decode_vec app_dso_from_aux envp_from_sp diag_boot diag_hex diag_raw; do
            hits=$(objdump -d --disassemble="$f" "$so" | grep -E '@plt|@GOTPCREL|call \*|jmp \*|callq|jmpq' || true)
            if [ -n "$hits" ]; then echo "== $f =="; echo "$hits" | head -8; fi
          done
          pre=$(for f in _dlstart _dlstart_boot _dlstart_c find_auxv relocate_self zero_words decode_dyn decode_vec app_dso_from_aux envp_from_sp diag_boot diag_hex diag_raw; do objdump -d --disassemble="$f" "$so"; done | grep -E '@plt|@GOTPCREL|call \*|jmp \*|callq|jmpq' || true)
          echo "$pre"
          test -z "$pre"
          echo "== GOT-filling relocs (want: only RELATIVE, no GLOB_DAT pre-reloc hazard) =="
          readelf -rW "$so" | awk '$3 ~ /GLOB_DAT|JUMP_SLOT/ {print}' | head -20
          echo "== RELATIVE count =="
          readelf -rW "$so" | grep -c RELATIVE
          echo "== hello's view of libc =="
          musl-gcc -Wl,--dynamic-linker,/tmp/zlibc-smoke/ld-musl-x86_64.so.1 \
            -o /tmp/zlibc-smoke/hello-a smoke/hello-a.c
          readelf -d /tmp/zlibc-smoke/hello-a | grep -iE 'interp|needed'

      - name: Run hello-a on zlibc
        run: |
          out=$(/tmp/zlibc-smoke/hello-a)
          test "$out" = "hello from zlibc 41"

      # Diagnostic on failure only: stage markers show how far the cold
      # boot got, strace shows the syscall trail to the fault.
      - name: Diagnose cold boot on failure
        if: failure()
        run: |
          /tmp/zlibc-smoke/hello-a || true
          echo "=== strace tail ==="
          strace -f -o /tmp/zlibc-smoke/trace.log /tmp/zlibc-smoke/hello-a || true
          tail -25 /tmp/zlibc-smoke/trace.log
          echo "=== gdb backtrace (which instruction faults?) ==="
          gdb --batch --ex run --ex bt --ex 'info registers rip rsp rdi rsi rax rbx' --ex 'x/i $pc' --args /tmp/zlibc-smoke/hello-a 2>&1 | tail -45 || true
          echo "=== section map around the fault addr ==="
          readelf -SW /tmp/zlibc-smoke/ld-musl-x86_64.so.1 | grep -E 'Name|\.text|\.plt|\.got|\.rodata|\.data|\.dynamic' | head -12
