name: ci

on:
  push:
  pull_request:

env:
  MUSL_SRC: ${{ github.workspace }}/musl

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch musl headers source (SrDicov mirror)
        run: git clone --depth 1 https://github.com/SrDicov/musl.git "$MUSL_SRC"

      - name: Install Rust stable + musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt

      - name: rustfmt
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build (host)
        run: cargo build --verbose

      - name: Build (x86_64-unknown-linux-musl)
        run: cargo build --verbose --target x86_64-unknown-linux-musl

      - name: Test (non-thread, parallel)
        run: 'timeout 120 cargo test --verbose -- --skip thread:: --skip errno::tests::errno_is_per_thread --skip validation::'
      # Thread tests touch per-thread CPU state (FS) and process-global
      # signal dispositions/registry: serial by design, like musl's own
      # tests. Parallel cargo threads would interleave that global state.
      # The errno test clones a real thread, so it rides along here.
      # So does the D5 validation test (threads + malloc + stdio).
      - name: Test thread (serial)
        run: 'timeout 120 cargo test --verbose -- thread:: errno::tests::errno_is_per_thread validation:: --test-threads=1'
      # DIAG ONLY trap the serial flake (revert): loop the serial filter
      # under gdb until a SIGSEGV lands, then print the backtrace.
      - name: DIAG gdb loop until serial SIGSEGV
        if: always()
        run: |
          sudo apt-get install -y gdb
          cargo test --no-run --verbose
          BIN=$(ls -t target/debug/deps/zlibc-* | grep -v '\.' | head -1)
          for i in $(seq 1 40); do
            echo "=== iter $i ==="
            timeout 60 gdb -batch -ex 'set confirm off' -ex run -ex 'thread apply all bt 10' -ex 'info registers rip rsp' --args "$BIN" thread:: errno::tests::errno_is_per_thread validation:: --test-threads=1 --nocapture > /tmp/gdbiter.txt 2>&1 || true
            if grep -aq 'SIGSEGV' /tmp/gdbiter.txt; then echo "CAUGHT on iter $i"; tail -45 /tmp/gdbiter.txt; break; fi
          done
      # Wave 5 gate packet 1: a real binary on zlibc only (our `_start`,
      # no host libc). The hello crate builds itself (abort + nostdlib);
      # this step asserts the exact bytes and the exit status.
      - name: Hello on zlibc only
        run: |
          cd hello
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo build --verbose
          out=$(./target/debug/hello)
          test "$out" = "hello from zlibc"
          out=$(./target/debug/hello-threads)
          test "$out" = "threads total 4950"
