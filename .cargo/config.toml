# Target-scoped flags for the linkable libc (6E gate). Scoped to
# x86_64-unknown-linux-musl on purpose: global RUSTFLAGS would poison
# the host build scripts (same lesson as hello/build.rs).
#
# - panic=abort: no unwinder anywhere in the freestanding objects.
# (The final `-shared` link below adds `-nostdlib -e _dlstart` itself;
# no link-args here because the archive stage does not link.)
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "panic=abort"]
