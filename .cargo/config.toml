# Target-scoped flags for the linkable libc (6E gate). Scoped to
# x86_64-unknown-linux-musl on purpose: global RUSTFLAGS would poison
# the host build scripts (same lesson as hello/build.rs).
#
# No rustflags: the archive stage does not link, and the final `-shared`
# link is a plain `cc` invocation in CI. (A `panic=abort` here was tried
# for the abandoned cdylib and broke the musl build: unwinding panics
# need the personality the archive itself provides, and abort strategy
# conflicts with it. Default unwind + our `rust_eh_personality` stub is
# what every green build used.)
