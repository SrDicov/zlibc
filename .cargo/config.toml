# Target-scoped flags for the linkable libc (6E gate). Scoped to
# x86_64-unknown-linux-musl on purpose: global RUSTFLAGS would poison
# the host build scripts (same lesson as hello/build.rs).
#
# panic=abort for the musl target: every musl-target build that ever
# linked and ran (all 6E smoke runs) had it active. Rationale: a
# freestanding libc has no unwinder to offer landing pads, so codegen
# must not generate them; abort turns every panic path into a trap.
# (Default unwind + a plain `#[no_mangle]` personality stub does NOT
# satisfy rustc's `eh_personality` lang-item requirement — that needs
# nightly `#[lang]` — so unwind builds hard-error here. When unwinding
# support genuinely lands, this flag goes away with it.)
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "panic=abort"]
