[package]
name = "zlibc"
version = "0.1.0"
edition = "2021"
description = "Rust rewrite of musl libc (ABI-exact, no_std)"
license = "MIT"

[lib]
# rlib for now; cdylib/staticlib once the linkable libc is assembled.
crate-type = ["rlib"]

[dependencies]
# Runtime helpers Rust cannot codegen inline (e.g. integer division
# helpers on some archs). Foundational: without this, no freestanding
# libc links. Default features are the standard external-use set.
compiler_builtins = "0.1"

[build-dependencies]
# None: build.rs shells out to the host gcc directly (see build.rs).
