[package]
name = "zlibc"
version = "0.1.0"
edition = "2021"
description = "Rust rewrite of musl libc (ABI-exact, no_std)"
license = "GPL-3.0-only"

[lib]
# rlib for unit tests and the hello bins; staticlib as the object stage
# for the 6E gate. No cdylib: rustc assumes musl targets are static-only
# and drops it ("dropping unsupported crate type"), so the shared object
# is linked by hand from the archive — exactly musl's own two-stage
# shape (objects, then `$(CC) -nostdlib -shared -Wl,-e,_dlstart`).
crate-type = ["staticlib", "rlib"]

# NOTE: no compiler_builtins dependency on purpose. The crates.io
# releases require a nightly compiler (unconditional #![feature]), so
# they cannot build on stable. On standard targets (host,
# x86_64-unknown-linux-musl) rustc already links the sysroot
# compiler-rt, which covers the helpers. Reintroduce compiler_builtins
# when moving to nightly or custom freestanding targets.
[dependencies]

[build-dependencies]
# None: build.rs shells out to the host gcc directly (see build.rs).
